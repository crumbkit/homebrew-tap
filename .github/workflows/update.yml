# Regenerates Formula/ and Casks/ from the latest release of every crumbkit
# app and commits the change to main. It runs every hour, on a manual run, on
# a push to main and on a pull request, and each run also runs the tests and
# `brew style`. Only a run on main commits.
name: Update formulas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: update-formulas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # The job commits regenerated formulas to main.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the generator
        run: tests/run.sh
      - name: Generate formulas
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/generate
      - name: Check formula and cask style
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style Formula/ Casks/
      - name: Commit changed formulas and casks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Formula/ Casks/ && [ -z "$(git ls-files --others --exclude-standard Formula/ Casks/)" ]; then
            echo "formulas and casks are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Formula/ Casks/
          git commit -m "Update formulas to the latest releases"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
